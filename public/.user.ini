; Surcharge des limites d'upload par défaut de Nixpacks (2M/8M), trop restrictives
; pour des documents réels (CV, pièces d'identité scannées, photos de profil).
; Nginx autorise déjà jusqu'à 100M (client_max_body_size), on reste large en dessous.
; Placé dans public/ car c'est la racine web réelle (root /app/public dans nginx.conf) :
; PHP-FPM scanne .user.ini dans le dossier du script exécuté (public/index.php).
upload_max_filesize = 15M
post_max_size = 20M
